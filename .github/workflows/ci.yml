name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      # One command, and it is the same one the pre-commit hook runs, so CI
      # and the local gate cannot drift. `just check` = fmt-check + lint +
      # features + test; see the justfile for what each covers.
      - name: check
        run: just check
