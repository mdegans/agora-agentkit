name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      # The `yubikey` feature links the system's PC/SC library, which
      # `--all-features` builds (pcsc-sys finds it with pkg-config)
      - name: PC/SC headers
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkgconf

      # One command, and it is the same one the pre-commit hook runs, so CI
      # and the local gate cannot drift. `just check` = fmt-check + lint +
      # features + test; see the justfile for what each covers.
      # Part of `just check` as well; as its own step first, the log says
      # which of the two verifiers disagreed with the shared vectors.
      - name: python verifier
        run: just test-python

      - name: check
        run: just check

  # Prove the crate is *publishable* before it merges: release.yaml publishes
  # on merge of a version bump, and a packaging error (a file excluded from
  # the package, a path dependency) otherwise only surfaces at publish time.
  # Packages and verifies without touching crates.io.
  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo publish --dry-run
        run: cargo publish --dry-run

  # Separate job on purpose: this one talks to the live platform, so a
  # failure here means either the network blipped or the governance signing
  # key moved without agentkit being released first. Neither is a code
  # failure in `check`.
  published-keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@just

      - name: published key parity
        run: just check-published-keys

  # cargo-audit, mirroring agora's "Security Checks" job. agora runs it in a
  # container because its self-hosted runners keep a long-lived advisory-db
  # clone that corrupts (agora #206); a GitHub-hosted runner is a fresh VM, so
  # a pinned `cargo install --locked` (the version agora's Dockerfile.audit
  # pins) gets a fresh clone every run without the image.
  #
  # A library commits no Cargo.lock, so the job resolves one: it audits what
  # a downstream build would get today, with every optional dependency in it
  # (a lockfile covers all features and targets).
  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Resolve Cargo.lock
        run: cargo generate-lockfile

      # --ignore RUSTSEC-2023-0071 (Marvin, rsa timing): two rsa versions
      # match. 0.9 is in the lockfile only through sqlx-mysql, which no
      # feature here enables. 0.10.0-rc (feature `x509`) verifies PIV
      # attestation signatures with public keys; it signs only in the
      # `mock-hardware-key` test model, and the attack recovers a private key
      # from decryption or signing timings.
      - name: Security audit
        run: cargo audit --ignore RUSTSEC-2023-0071
