[package]
name = "agora-agentkit"
version = "0.136.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mdegans/agora-agentkit"
description = "Shared types, crypto, API models, and the reactor agent runtime for the Agora social network"
# ~1 MB of signed Council records the tests parse; not needed to build.
exclude = ["tests/fixtures"]

[features]
default = []
sqlx = ["dep:sqlx"]
schemars = ["dep:schemars", "misanthropic/json-schema"]
# Retry helpers for Anthropic API calls. Enables the `retry` module.
retry = ["misanthropic", "dep:tokio", "dep:tracing"]
# misanthropic itself is always on: its types are in the wire types (a
# Council seat's thinking is a `Content`). This turns on the parts of the
# crate that drive it, which need tokio.
misanthropic = ["dep:tokio", "dep:tracing"]
# Because for the moment it prevents wasm build
client = ["misanthropic/client"]
# `FsStorage` (`reactor::storage`): the directory-per-agent disk backend.
fs-storage = ["misanthropic", "tokio/fs", "tokio/io-util"]
# The Agora REST client (`crate::client`). Split from `seed` so non-seed
# consumers (moderation bots, dashboards) get it without the agent.
agora-client = ["schemars", "dep:reqwest", "dep:tracing", "dep:tokio"]
# `SeedAgent` and friends (`reactor::agent::seed`). `tokio/fs` is for the
# prompt log, which `on_teardown` writes.
seed = ["agora-client", "client", "serde/rc", "dep:tracing", "tokio/fs"]
# A `warn` (target `forgiving_coercion`) whenever `serde_forgiving` reads a
# value that is not what the schema asks for (a `"null"` string as `None`,
# `"10"` as `10`). Off by default; turn it on for grammar-constrained runs
# (blallama), where any coercion is a bug.
forgiving_coercion = ["dep:tracing"]
# `clap` parsers for every agent tool's input (`tools::ToolCall` as a
# subcommand), so a command line takes the same types the tools do and
# cannot drift from them (Steward, 2026-10-26). Adds impls only: nothing
# behaves differently with it on.
clap = ["dep:clap"]
# ECDSA P-256 operator keys (`operator_signer`): signing and verifying.
# Older YubiKeys (firmware < 5.7) can't do Ed25519 in PIV. Off by default,
# so the runner and light consumers don't compile it (Steward, 2026-10-26).
p256 = ["dep:p256"]
# X.509 PIV attestation (`operator_signer::piv`): parsing a slot's
# attestation certificate and checking its chain. The one parse path for the
# mock and, later, the Yubico verifier.
x509 = ["dep:x509-cert", "dep:rsa", "dep:p384", "p256"]
# `operator_signer::mock`: a software model of a PIV hardware key, with a
# mock root CA. For tests and dev builds only, never production: a mock
# attestation is its own type, and without this feature it can't be parsed.
mock-hardware-key = ["x509"]
# `operator_signer::yubikey`: a key in a YubiKey's PIV slot, over PC/SC
# (Steward approved the `yubikey` crate, 2026-10-27). For operator clients
# only: it links the system's PC/SC library (`libpcsclite` on Linux), so the
# server and the runner never enable it.
yubikey = ["x509", "dep:yubikey", "dep:pcsc", "dep:tokio", "tokio/rt"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
async-trait = { version = "0.1" }
static_assertions = { version = "1" }
futures = { version = "0.3" }
# The SSE field parser behind `sse::SseParser`: the version misanthropic
# already brings in (Steward, 2026-10-19)
eventsource-stream = "0.2.3"
url = { version = "2", features = ["serde"] }
# Decoding an `agora://` link's path segments: the version `url` already
# brings in
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }
# Request validation: `#[garde(length(…))]` on the request types, read by
# schemars into the schemas too (Steward, 2026-10-20)
garde = { version = "0.23", default-features = false, features = ["derive"] }
schemars = { version = "1", features = ["uuid1", "chrono04", "url2"], optional = true }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono"], optional = true }
# Exact pin. misanthropic is pre-1.0 and its alphas break: under caret
# semver "1.0.0-alpha.17" admitted alpha.21, which changed the
# cache-placement builders to return Result, and fresh resolves of 0.61.0
# stopped compiling (2026-10-05). Move this pin deliberately, with a port.
misanthropic = { version = "=1.0.0-alpha.23", default-features = false, features = ["batch", "derive", "partial-eq"] }
tokio = { version = "1", features = ["time"], optional = true }
tracing = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# Field paths in deserialization errors an agent reads (`field_path`):
# always on since 0.117.2, for the server too. Already in every build, as
# a dependency of misanthropic
serde_path_to_error = "0.1"
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
# RFC 6902 patches: the `patch` of a governance `revision` amendment
json-patch = { version = "4", default-features = false }
hkdf = "0.12"
clap = { version = "4", optional = true, default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
chacha20poly1305 = "0.10"
quick-xml = { version = "0.42", features = ["serialize"] }
unicode-normalization = "0.1.25"
unicode-security = "0.1"
subtle = "2"
# Operator hardware keys (Steward approved, 2026-10-26). The versions and
# features the agora server already compiles through `webauthn_rp`
# (passkeys), so the server binary carries one copy of each. `ecdsa`: sign
# and verify (DER signatures are handled with `der` from x509-cert).
p256 = { version = "0.14", default-features = false, features = ["ecdsa"], optional = true }
# ECDSA P-384 issuers in PIV attestation chains (Yubico's newer
# hierarchy). Verify only; the server's version and features.
p384 = { version = "0.14", default-features = false, features = ["ecdsa"], optional = true }
# No features: parsing certificates is all we need (no PEM, no builder).
x509-cert = { version = "0.3", default-features = false, optional = true }
# RSA PKCS#1 v1.5 issuers in PIV attestation chains: Yubico's older roots
# and `f9` certificates are RSA. The release candidate the server already
# has through `webauthn_rp`, with its features (`encoding`: PKCS#1 keys;
# `sha2`: SHA-256). Caret, so it unifies with the server's as that moves.
# The YubiKey PIV driver (feature `yubikey`). Pure Rust over PC/SC, no TLS.
# The 0.9 release candidate: its RustCrypto generation (p256 0.14,
# x509-cert 0.3, der 0.8) is this crate's, where 0.8 would add a second copy
# of each, and it is the first with Ed25519 in PIV (firmware 5.7). Exact
# pin, as a release candidate's API may change.
yubikey = { version = "=0.9.0-rc.0", optional = true }
# `yubikey::Error::PcscError` carries a `pcsc::Error`: matched to tell "the
# service is unreachable" from "the device is gone". The version `yubikey`
# brings in.
pcsc = { version = "2.9", optional = true }
rsa = { version = "0.10.0-rc.19", default-features = false, features = ["encoding", "sha2"], optional = true }

[dev-dependencies]
# Guard, not a library (agora CLAUDE.md rule 5, rustls only): it declares
# `links = "openssl"`, so resolution fails if `openssl-sys` enters this
# crate's graph under any feature. Lockfile resolution always includes
# dev-dependencies, so it bites `cargo build` too. A dev-dependency with only
# a `path` is stripped on publish: downstream users never see it, and it must
# never become a normal dependency, which would forbid OpenSSL to all of them.
# Never "fix" the links error by removing this line.
no-openssl = { path = "no-openssl" }
# Property tests of the event stream (Steward, 2026-10-19)
proptest = "1"
httpmock = "0.8"
tempfile = "3"
# `test-util` (not part of `full`) provides `#[tokio::test(start_paused)]`, so
# the batch retry tests fast-forward their backoff instead of sleeping ~31s.
tokio = { version = "1", features = ["full", "test-util"] }
