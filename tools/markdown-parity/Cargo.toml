# agora-server's markdown renderer, copied, to record what it draws for
# `ui::markdown`'s parity corpus (`src/ui/markdown/corpus.json`). Not part
# of the crate (excluded from the package) and not a dependency of it:
# ammonia is the server's, at the server's version. Run with
# `just markdown-corpus`.
[package]
name = "markdown-parity"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
agora-agentkit = { path = "../..", features = ["dioxus-ssr"] }
# agora's Cargo.lock (2026-11-15): the versions agora-server renders with
ammonia = "=4.2.5"
pulldown-cmark = "=0.12.2"
serde_json = "1"
